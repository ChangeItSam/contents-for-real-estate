name: Refresh agent news
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    paths:
      - "tools/fetch_news.py"
      - ".github/workflows/news.yml"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/fetch_news.py
      - name: Commit if changed
        run: |
          git config user.name "news-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add checklist/data/news.json
          git diff --cached --quiet || (git commit -m "Refresh agent news" && git pull --rebase -q && git push)
