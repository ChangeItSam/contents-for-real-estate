name: Refresh YouTube links
on:
  schedule:
    - cron: "41 3 * * *"   # daily 07:41 Dubai
  workflow_dispatch:
  push:
    paths:
      - "tools/fetch_youtube_links.py"
      - ".github/workflows/youtube-links.yml"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/fetch_youtube_links.py
      - name: Commit if changed
        run: |
          git config user.name "links-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/links.json
          git diff --cached --quiet || (git commit -m "Refresh YouTube links" && git pull --rebase && git push)
