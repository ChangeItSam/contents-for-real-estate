name: Refresh DLD project list
on:
  schedule:
    - cron: "17 2 * * 1"   # every Monday 06:17 Dubai
  workflow_dispatch:
  push:
    paths:
      - "tools/fetch_dld_projects.py"
      - ".github/workflows/dld-projects.yml"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/fetch_dld_projects.py
      - name: Commit if changed
        run: |
          git config user.name "dld-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add checklist/data
          git diff --cached --quiet || (git commit -m "Refresh DLD project list" && git push)
