name: Refresh DLD data (daily)
on:
  schedule:
    - cron: "17 2 * * *"   # every day 06:17 Dubai
  workflow_dispatch:
  push:
    paths:
      - "tools/fetch_dld_projects.py"
      - "tools/fetch_dld_psf.py"
      - "tools/fetch_dld_insights.py"
      - "checklist/data/developer_grades.json"
      - ".github/workflows/dld-projects.yml"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/fetch_dld_projects.py
      - run: python tools/fetch_dld_psf.py
        continue-on-error: true
      - run: python tools/fetch_dld_insights.py
        continue-on-error: true
      - name: Commit if changed
        run: |
          git config user.name "dld-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add checklist/data
          git diff --cached --quiet || (git commit -m "Refresh DLD project list and PSF data" && git push)
