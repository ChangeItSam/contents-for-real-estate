name: Refresh Premium market dashboard
on:
  schedule:
    - cron: "41 2 * * 2"   # Tuesdays 06:41 Dubai
  workflow_dispatch:
  push:
    paths:
      - "tools/fetch_market_premium.py"
      - "tools/fetch_dxb_map.py"
      - ".github/workflows/market.yml"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/fetch_market_premium.py
      - run: python tools/fetch_dxb_map.py
        continue-on-error: true
      - name: Commit if changed
        run: |
          git config user.name "market-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add checklist/data/market_premium.json checklist/data/dxb_map.json
          git diff --cached --quiet || (git commit -m "Refresh Premium market dashboard" && git pull --rebase -q && git push)
