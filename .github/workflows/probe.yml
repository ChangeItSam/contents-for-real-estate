name: Probe broker register (manual)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://gslb.dubaipulse.gov.ae/api/3/action/resource_show?id=84897e8a-1c2f-43df-8e55-bea205a8a66e" "https://gslb.dubaipulse.gov.ae/data/dld-registration/dld_brokers-open" "https://api.dubaipulse.gov.ae/open/dld/dld_brokers-open-api?limit=2" "https://dubailand.gov.ae/en/open-data/real-estate-data/"; do
            echo "== $u"; curl -sSL -m 40 -A "Mozilla/5.0" "$u" -o p.out -w "HTTP %{http_code} %{size_download}\n" || true; head -c 300 p.out; echo; grep -o 'https://[^"]*84897e8a[^"]*' p.out | head -3; grep -o 'https://[^" ]*[Bb]roker[^" ]*\.csv' p.out | head -3
          done
