name: Probe broker register (manual)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://www.dubaipulse.gov.ae/data/dld-registration/dld_brokers-open https://www.dubaipulse.gov.ae/data/dld-licenses/dld_brokers-open; do
            echo "== $u"; curl -sSL -m 60 -A "Mozilla/5.0" "$u" -o p.html -w "HTTP %{http_code}\n"; grep -o 'https://www.dubaipulse.gov.ae/dataset/[^"]*download/[^"]*' p.html | sort -u | head; grep -o '<td>[a-z_]*</td>' p.html | sort -u | head -30
          done
          U=$(grep -ho 'https://www.dubaipulse.gov.ae/dataset/[^"]*download/[^"]*brokers[^"]*\.csv' p.html | head -1)
          [ -z "$U" ] && U=$(curl -sSL -m 60 -A "Mozilla/5.0" https://www.dubaipulse.gov.ae/data/dld-registration/dld_brokers-open | grep -o 'https://www.dubaipulse.gov.ae/dataset/[^"]*download/[^"]*\.csv' | head -1)
          echo "CSV: $U"; [ -n "$U" ] && curl -sSL -m 120 -A "Mozilla/5.0" "$U" -o b.csv && wc -l b.csv && head -3 b.csv | cut -c1-400
