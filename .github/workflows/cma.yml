name: Refresh like-for-like comparables (CMA)
on:
  schedule:
    - cron: "27 2 * * 1"   # Mondays 06:27 Dubai
  workflow_dispatch:
  push:
    paths:
      - "tools/fetch_cma.py"
      - ".github/workflows/cma.yml"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/fetch_cma.py
      - name: Commit if changed
        run: |
          git config user.name "cma-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add checklist/data/cma.json
          git diff --cached --quiet || (git commit -m "Refresh like-for-like comparables" && git pull --rebase -q && git push)
